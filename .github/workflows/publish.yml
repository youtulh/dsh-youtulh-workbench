# 推一个 v* 标签就自动发布到 npm，用 Trusted Publishing（OIDC），不需要任何 token。
# 前置：在 npm 包的 Settings → Publishing access → Trusted publishers 里绑定这个仓库和这个文件名。
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # registry-url 会让 setup-node 写好 .npmrc；npm 才会去走 OIDC 换 token 这条路
          registry-url: 'https://registry.npmjs.org'
      - name: 装上支持 trusted publishing 的 npm
        run: npm install -g npm@latest
      - run: npm ci
      - name: 跑测试
        run: node --test test/*.test.js
      - name: 标签和 package.json 版本必须一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "标签 $TAG 和 package.json 的版本 $PKG 不一致"
            exit 1
          fi
      - name: 发布
        run: npm publish --access public --provenance
